<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>انعكاس – عاكس الصور والفيديو</title>
<style>
:root{--bg:#0b0d14;--card:#151a26;--card2:#1c2333;--line:#262e42;--tx:#eef1f8;--mut:#8b95ad;--ac:#7c5cff;--ac2:#22d3ee;--ok:#34d399;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--tx);
background:radial-gradient(900px 500px at 85% -10%,#2a1f6b55,transparent 60%),radial-gradient(700px 500px at 0% 100%,#0e5a6b44,transparent 60%),var(--bg);background-attachment:fixed}
.app{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 8px 24px #7c5cff55}
h1{font-size:22px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
.stage{position:relative;border-radius:22px;background:var(--card);border:1px solid var(--line);aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center}
.stage .empty{text-align:center;color:var(--mut);padding:20px;font-size:14px;line-height:1.7}
.stage .empty b{display:block;font-size:40px;margin-bottom:6px}
#view{max-width:100%;max-height:100%;display:none;transition:transform .25s ease;background:#000}
.badge{position:absolute;top:10px;left:10px;background:#000a;padding:4px 10px;border-radius:99px;font-size:12px;display:none}
.row{display:grid;gap:10px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn:active{transform:scale(.97)}
.rect{height:56px;font-weight:600}
.sq{aspect-ratio:1;flex-direction:column;font-size:13px;color:var(--mut)}
.sq svg{width:30px;height:30px}
.sq.on{background:var(--card2);border-color:var(--ac);color:var(--tx)}
.pri{background:linear-gradient(135deg,var(--ac),#5b8cff);border:0}
.grn{background:linear-gradient(135deg,#10b981,#22d3ee);border:0;color:#04201a}
.btn:disabled{opacity:.4;pointer-events:none}
.sec{color:var(--mut);font-size:12px;margin:4px 2px -4px}
#msg{min-height:20px;text-align:center;font-size:13px;color:var(--ac2)}
input[type=file]{display:none}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" style="color:#fff"><path d="M12 3v18"/><path d="M8 7 3 17h5z"/><path d="m16 7 5 10h-5z"/></svg></div>
<div><h1>انعكاس</h1><p>اعكس صورك وفيديوهاتك بلمسة واحدة</p></div>
</header>

<div class="stage" id="stage">
<div class="empty" id="empty"><b>🪞</b>اختر صورة أو فيديو<br>من المعرض أو من ملفات الجهاز</div>
<img id="vimg" alt="" style="display:none;max-width:100%;max-height:100%">
<video id="vvid" playsinline controls loop style="display:none;max-width:100%;max-height:100%"></video>
<span class="badge" id="badge"></span>
</div>

<div class="row r2">
<button class="btn rect pri" id="bGal"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>من المعرض</button>
<button class="btn rect" id="bFile"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>من الملفات</button>
</div>
<input type="file" id="fGal" accept="image/*,video/*">
<input type="file" id="fFile" accept="image/*,video/*,.mp4,.mov,.webm,.jpg,.jpeg,.png,.webp,.heic">

<div class="sec">أدوات الانعكاس</div>
<div class="row r3">
<button class="btn sq" id="tH"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7 3 17h5z"/><path d="m16 7 5 10h-5z"/></svg>أفقي</button>
<button class="btn sq" id="tV"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M7 8 17 3v5z" transform="rotate(90 12 12)"/><path d="M7 16h10l-5 5z"/></svg>رأسي</button>
<button class="btn sq" id="tR"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>تدوير</button>
</div>
<button class="btn rect" id="bReset" style="height:44px;color:var(--mut)">إعادة ضبط</button>

<div class="sec">الحفظ والمشاركة</div>
<div class="row r2">
<button class="btn rect grn" id="bSave" disabled><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 19h16"/></svg>حفظ</button>
<button class="btn rect pri" id="bShare" disabled><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>مشاركة</button>
</div>
<div id="msg"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let file=null,url=null,isVid=false,fh=false,fv=false,rot=0,busy=false;
const img=$('vimg'),vid=$('vvid'),msg=$('msg');
const say=t=>msg.textContent=t||'';
function apply(){
  const el=isVid?vid:img;
  el.style.transform='rotate('+rot+'deg) scale('+(fh?-1:1)+','+(fv?-1:1)+')';
  el.style.transition='transform .25s';
  $('tH').classList.toggle('on',fh);$('tV').classList.toggle('on',fv);$('tR').classList.toggle('on',rot%360!==0);
}
function load(f){
  if(!f)return;
  if(url)URL.revokeObjectURL(url);
  file=f;url=URL.createObjectURL(f);isVid=f.type.startsWith('video')||/\.(mp4|mov|webm)$/i.test(f.name);
  fh=true;fv=false;rot=0;say('');
  $('empty').style.display='none';
  img.style.display=isVid?'none':'block';vid.style.display=isVid?'block':'none';
  if(isVid){vid.src=url;vid.play().catch(()=>{})}else img.src=url;
  $('badge').style.display='block';$('badge').textContent=isVid?'🎬 فيديو':'🖼️ صورة';
  $('bSave').disabled=$('bShare').disabled=false;
  img.style.transition=vid.style.transition='none';apply();
}
$('bGal').onclick=()=>$('fGal').click();$('bFile').onclick=()=>$('fFile').click();
$('fGal').onchange=$('fFile').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('tH').onclick=()=>{fh=!fh;apply()};$('tV').onclick=()=>{fv=!fv;apply()};
$('tR').onclick=()=>{rot+=90;apply()};
$('bReset').onclick=()=>{fh=fv=false;rot=0;apply()};

function draw(ctx,src,w,h,sw,sh){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);
  ctx.translate(w/2,h/2);ctx.rotate(rot*Math.PI/180);ctx.scale(fh?-1:1,fv?-1:1);
  ctx.drawImage(src,-sw/2,-sh/2,sw,sh);
}
async function makeImage(){
  const sw=img.naturalWidth,sh=img.naturalHeight,q=Math.abs(rot/90)%2===1;
  const c=document.createElement('canvas');c.width=q?sh:sw;c.height=q?sw:sh;
  draw(c.getContext('2d'),img,c.width,c.height,sw,sh);
  const jpg=/jpe?g/i.test(file.type);
  const blob=await new Promise(r=>c.toBlob(r,jpg?'image/jpeg':'image/png',.95));
  return {blob,name:'inikas-'+Date.now()+(jpg?'.jpg':'.png')};
}
async function makeVideo(){
  const v=document.createElement('video');v.src=url;v.playsInline=true;
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no});
  const sw=v.videoWidth,sh=v.videoHeight,q=Math.abs(rot/90)%2===1;
  const c=document.createElement('canvas');c.width=q?sh:sw;c.height=q?sw:sh;
  const ctx=c.getContext('2d'),stream=c.captureStream(30);
  try{const ac=new AudioContext(),s=ac.createMediaElementSource(v),d=ac.createMediaStreamDestination();s.connect(d);d.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){}
  const mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,mt?{mimeType:mt}:{}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  let on=true;(function loop(){if(!on)return;draw(ctx,v,c.width,c.height,sw,sh);
    say('جارٍ المعالجة… '+Math.round(v.currentTime/v.duration*100)+'%');requestAnimationFrame(loop)})();
  v.onended=()=>{on=false;rec.stop()};
  rec.start();await v.play();await done;
  const ext=mt.startsWith('video/mp4')?'mp4':'webm';
  return {blob:new Blob(chunks,{type:'video/'+ext}),name:'inikas-'+Date.now()+'.'+ext};
}
async function build(){
  if(busy)return null;busy=true;$('bSave').disabled=$('bShare').disabled=true;
  try{return isVid?await makeVideo():await makeImage()}
  catch(e){say('تعذّرت المعالجة على هذا الجهاز');return null}
  finally{busy=false;$('bSave').disabled=$('bShare').disabled=false}
}
const CAP=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform();
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
function webSave(o){const a=document.createElement('a');a.href=URL.createObjectURL(o.blob);a.download=o.name;document.body.appendChild(a);a.click();a.remove()}
$('bSave').onclick=async()=>{
  const o=await build();if(!o)return;
  try{
    if(CAP){const FS=Capacitor.Plugins.Filesystem;
      await FS.writeFile({path:'Inikas/'+o.name,data:await b64(o.blob),directory:'DOCUMENTS',recursive:true});
      say('✅ تم الحفظ في مجلد Documents/Inikas')}
    else{webSave(o);say('✅ تم الحفظ')}
  }catch(e){say('تعذّر الحفظ')}
};
$('bShare').onclick=async()=>{
  const o=await build();if(!o)return;
  try{
    if(CAP){const FS=Capacitor.Plugins.Filesystem;
      await FS.writeFile({path:o.name,data:await b64(o.blob),directory:'CACHE'});
      const u=await FS.getUri({path:o.name,directory:'CACHE'});
      await Capacitor.Plugins.Share.share({files:[u.uri],dialogTitle:'مشاركة'});}
    else{const f=new File([o.blob],o.name,{type:o.blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{webSave(o);say('تم الحفظ بدلاً من المشاركة')}}
  }catch(e){say(e&&e.name==='AbortError'?'':'تعذّرت المشاركة')}
};
</script>
</body>
  </html>
